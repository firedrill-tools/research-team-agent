[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-team-agent"
version = "0.2.0"
readme = "README.md"
description = "CrewAI researcher, checker and writer over controlled source packs"
requires-python = ">=3.12"
dependencies = ["crewai==1.15.28", "openai==2.54.0", "anthropic==1.14.0", "google-genai==2.31.0", "httpx==0.28.1", "httpx2==2.13.1"]

[project.scripts]
research-team = "research_team.__main__:cli"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "research_team/sample_data"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "fixtures", "tests", "scripts", ".github", "README.md", "AGENTS.md", "PLAN.md", "COMPATIBILITY.md", "pyproject.toml", "uv.lock", ".gitignore"]
