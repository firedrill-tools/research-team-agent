name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra test
      - run: uv run --locked --extra test pytest -q
